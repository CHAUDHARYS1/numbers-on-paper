<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Numbers on Paper — Dashboard</title>
<link rel="icon" href="numbers-on-paper-assets/favicon/favicon.svg" type="image/svg+xml" />

<!-- Brand fonts (this project): Space Grotesk + Space Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<!-- Phosphor icons (Taskmaster Pro icon system) -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

<!-- Taskmaster Pro design tokens + component classes -->
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/fonts.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/colors.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/typography.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/spacing.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/effects.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/base.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/components/ui.css" />
<!-- App chrome (font override lives here) -->
<link rel="stylesheet" href="app/app.css" />

<style>
  /* ── Dashboard-specific layout ── */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); margin-bottom:var(--space-6); }
  .stat{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow-card); padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-3); }
  .stat-top{ display:flex; align-items:center; justify-content:space-between; }
  .stat-ic{ width:36px; height:36px; border-radius:var(--radius); display:grid; place-items:center; font-size:19px; }
  .stat-ic--amber{ background:var(--amber-tint); color:var(--amber); }
  .stat-ic--green{ background:var(--green-tint); color:var(--green); }
  .stat-ic--accent{ background:var(--accent-tint); color:var(--accent); }
  .stat-ic--gray{ background:var(--paper-2); color:var(--ink-3); }
  .stat-count{ font-family:var(--font-mono); font-size:var(--text-sm); color:var(--ink-4); font-weight:700; letter-spacing:.06em; }
  .stat-val{ font-family:var(--font-mono); font-size:30px; font-weight:700; letter-spacing:-.02em; color:var(--ink); line-height:1; }
  .stat-label{ font-size:var(--text-md); color:var(--ink-3); font-weight:500; }

  .dash-row{ display:grid; grid-template-columns:1.7fr 1fr; gap:var(--space-4); margin-bottom:var(--space-6); align-items:stretch; }
  .dash-row > .card{ display:flex; flex-direction:column; }
  .dash-row > .card .card-body{ flex:1; }

  /* Bar chart */
  .chart{ display:flex; align-items:flex-end; gap:var(--space-3); height:230px; }
  .chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; height:100%; justify-content:flex-end; }
  .chart-bar-wrap{ width:100%; display:flex; justify-content:center; align-items:flex-end; flex:1; }
  .chart-bar{ width:100%; max-width:48px; border-radius:5px 5px 0 0; background:var(--accent); transition:filter .15s; min-height:4px; }
  .chart-bar:hover{ filter:brightness(1.1); }
  .chart-bar--now{ background:color-mix(in srgb, var(--accent) 32%, var(--card)); border:1.5px dashed var(--accent); }
  .chart-v{ font-family:var(--font-mono); font-size:var(--text-body); color:var(--ink-2); font-weight:700; }
  .chart-m{ font-family:var(--font-mono); font-size:var(--text-sm); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-4); }
  .chart-legend{ display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-body); color:var(--ink-4); }
  .chart-legend .dot{ width:9px; height:9px; border-radius:2px; }

  /* Outstanding rail */
  .duelist{ display:flex; flex-direction:column; }
  .due{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) 0; border-bottom:1px solid var(--line-soft); }
  .due:first-child{ padding-top:0; }
  .due:last-child{ border-bottom:none; padding-bottom:0; }
  .due-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .due-main{ flex:1; min-width:0; }
  .due-client{ font-size:var(--text-md); font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .due-meta{ font-family:var(--font-mono); font-size:var(--text-body); color:var(--ink-4); }
  .due-amt{ font-family:var(--font-mono); font-weight:700; color:var(--ink); font-size:var(--text-md); white-space:nowrap; }
  .rail-foot{ margin-top:var(--space-4); padding-top:var(--space-4); border-top:1px solid var(--line); display:flex; align-items:baseline; justify-content:space-between; }
  .rail-foot .lbl{ font-size:var(--text-body); color:var(--ink-4); }
  .rail-foot .amt{ font-family:var(--font-mono); font-size:var(--text-lg); font-weight:700; color:var(--ink); }

  @media (max-width:1080px){ .stats{ grid-template-columns:repeat(2,1fr); } .dash-row{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .stats{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- The DS bundle ships a self-mounting demo app that grabs #root.
     Neutralize its mount so only OUR app renders; restore after. -->
<script>
  (function () {
    const real = ReactDOM.createRoot.bind(ReactDOM);
    ReactDOM.createRoot = function () { return { render() {}, unmount() {} }; };
    window.__restoreCreateRoot = function () { ReactDOM.createRoot = real; };
  })();
</script>
<!-- Design system bundle (plain JS) + app data (plain JS) -->
<script src="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/_ds_bundle.js"></script>
<script>window.__restoreCreateRoot();</script>
<script src="app/data.js"></script>

<!-- Shared shell + page (JSX) -->
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel">
const { Avatar, Badge, Button, SegmentedControl } = window.TaskmasterProDesignSystem_b94546;
const NOP = window.NOP;
const { invoices, revenue, effStatus, fmt, fmt0, fmtDate, fmtDateShort, TODAY } = NOP;

const STATUS = {
  paid:    ['green', 'Paid'],
  unpaid:  ['amber', 'Due'],
  overdue: ['red',   'Overdue'],
  draft:   ['gray',  'Draft'],
};
function StatusBadge({ inv }) {
  const [tone, label] = STATUS[effStatus(inv)] || ['gray', '—'];
  return <Badge tone={tone}>{label}</Badge>;
}

const daysUntil = d => Math.round((new Date(d + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 86400000);

function StatCard({ icon, tone, value, label, count }) {
  return (
    <div className="stat">
      <div className="stat-top">
        <div className={'stat-ic stat-ic--' + tone}><i className={'ph ' + icon}></i></div>
        {count != null ? <span className="stat-count">{count}</span> : null}
      </div>
      <div className="stat-val">{value}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

function RevenueChart() {
  const max = Math.max(...revenue.map(r => r.v));
  return (
    <div>
      <div className="chart">
        {revenue.map((r, i) => {
          const now = i === revenue.length - 1;
          return (
            <div className="chart-col" key={r.m}>
              <div className="chart-v">{fmt0(r.v)}</div>
              <div className="chart-bar-wrap">
                <div className={'chart-bar' + (now ? ' chart-bar--now' : '')}
                     style={{ height: Math.max(6, Math.round((r.v / max) * 100)) + '%' }}
                     title={r.m + ' · ' + fmt(r.v)}></div>
              </div>
              <div className="chart-m">{r.m}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OutstandingRail() {
  const open = invoices
    .filter(i => i.status === 'unpaid')
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
  const total = open.reduce((s, i) => s + i.total, 0);
  return (
    <div>
      <div className="duelist">
        {open.map(inv => {
          const dleft = daysUntil(inv.due_date);
          const color = inv.overdue ? 'var(--red)' : (dleft <= 7 ? 'var(--amber)' : 'var(--ink-4)');
          const meta = inv.overdue
            ? `${Math.abs(dleft)}d overdue · ${inv.invoice_number}`
            : `Due in ${dleft}d · ${inv.invoice_number}`;
          return (
            <a className="due" key={inv.id} href={'Invoice.html?id=' + inv.id}>
              <span className="due-dot" style={{ background: color }}></span>
              <div className="due-main">
                <div className="due-client">{inv.clientName}</div>
                <div className="due-meta" style={{ color }}>{meta}</div>
              </div>
              <span className="due-amt">{fmt(inv.total)}</span>
            </a>
          );
        })}
      </div>
      <div className="rail-foot">
        <span className="lbl">Total outstanding</span>
        <span className="amt">{fmt(total)}</span>
      </div>
    </div>
  );
}

function RecentTable() {
  const recent = [...invoices]
    .sort((a, b) => (b.issue_date || '0').localeCompare(a.issue_date || '0'))
    .slice(0, 6);
  return (
    <div className="tbl-wrap">
    <table className="tbl">
      <thead>
        <tr>
          <th>Invoice</th><th>Client</th><th>Issued</th><th>Status</th><th className="t-right">Amount</th>
        </tr>
      </thead>
      <tbody>
        {recent.map(inv => (
          <tr key={inv.id} onClick={() => location.href = 'Invoice.html?id=' + inv.id} style={{ cursor: 'pointer' }}>
            <td><a className="t-num" href={'Invoice.html?id=' + inv.id} onClick={e => e.stopPropagation()}>{inv.invoice_number}</a></td>
            <td>
              <div className="cli">
                <Avatar name={inv.clientName} userId={inv.client} size="sm" />
                <span className="t-client">{inv.clientName}</span>
              </div>
            </td>
            <td className="t-date">{fmtDate(inv.issue_date)}</td>
            <td><StatusBadge inv={inv} /></td>
            <td className="t-amt">{fmt(inv.total)}</td>
          </tr>
        ))}
      </tbody>
    </table>
    </div>
  );
}

function Dashboard() {
  const paid    = invoices.filter(i => i.status === 'paid');
  const unpaid  = invoices.filter(i => i.status === 'unpaid');
  const drafts  = invoices.filter(i => i.status === 'draft');
  const overdue = invoices.filter(i => i.overdue);

  const collected   = paid.reduce((s, i) => s + i.total, 0);
  const outstanding = unpaid.reduce((s, i) => s + i.total, 0);
  const totalAll    = invoices.filter(i => i.status !== 'draft').reduce((s, i) => s + i.total, 0);

  const actions = (
    <>
      <div className="topbar-search">
        <i className="ph ph-magnifying-glass"></i>
        <input placeholder="Search invoices, clients…" aria-label="Search" />
      </div>
      <Button variant="primary" onClick={() => location.href = 'InvoiceEditor.html'}>
        <i className="ph ph-plus" style={{ fontSize: 16 }}></i> New invoice
      </Button>
    </>
  );

  return (
    <window.AppShell active="dashboard" title="Dashboard"
                     description="A quick read on what you've billed and what's still coming in." actions={actions}>
      <div className="stats">
        <StatCard icon="ph-clock-countdown" tone="amber"  value={fmt0(outstanding)} label="Outstanding" count={unpaid.length + ' open'} />
        <StatCard icon="ph-check-circle"    tone="green"  value={fmt0(collected)}   label="Collected"   count="this year" />
        <StatCard icon="ph-trend-up"        tone="accent" value={fmt0(totalAll)}    label="Total invoiced" count={(invoices.length - drafts.length) + ' sent'} />
        <StatCard icon="ph-file-dashed"     tone="gray"   value={drafts.length}     label="Drafts"      count={overdue.length ? overdue.length + ' overdue' : 'none overdue'} />
      </div>

      <div className="dash-row">
        <section className="card">
          <div className="card-head">
            <div>
              <h2 className="card-title">Revenue collected</h2>
              <p className="card-sub">Payments received per month</p>
            </div>
            <SegmentedControl options={['6 mo', '12 mo']} value="6 mo" onChange={() => {}} />
          </div>
          <div className="card-body">
            <RevenueChart />
            <div className="chart-legend" style={{ marginTop: 'var(--space-4)' }}>
              <span className="dot" style={{ background: 'var(--accent)' }}></span> Collected
              <span className="dot" style={{ background: 'color-mix(in srgb, var(--accent) 32%, var(--card))', border: '1.5px dashed var(--accent)', marginLeft: 'var(--space-4)' }}></span> Current month (in progress)
            </div>
          </div>
        </section>

        <section className="card">
          <div className="card-head">
            <div>
              <h2 className="card-title">Outstanding</h2>
              <p className="card-sub">Sorted by due date</p>
            </div>
          </div>
          <div className="card-body">
            <OutstandingRail />
          </div>
        </section>
      </div>

      <section className="card">
        <div className="card-head">
          <h2 className="card-title">Recent invoices</h2>
          <a className="card-link" href="Invoices.html">View all →</a>
        </div>
        <div className="card-body" style={{ padding: 0 }}>
          <RecentTable />
        </div>
      </section>
    </window.AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
