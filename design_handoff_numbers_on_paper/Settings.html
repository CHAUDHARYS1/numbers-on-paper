<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Numbers on Paper — Settings</title>
<link rel="icon" href="numbers-on-paper-assets/favicon/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/fonts.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/colors.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/typography.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/spacing.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/effects.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/tokens/base.css" />
<link rel="stylesheet" href="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/components/ui.css" />
<link rel="stylesheet" href="app/app.css" />
<link rel="stylesheet" href="app/forms.css" />
<style>
  .settings-wrap{ max-width:760px; }
  .del-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.32); display:flex; align-items:center; justify-content:center; z-index:100; padding:var(--space-5); }
  .del-modal{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-float); width:100%; max-width:440px; padding:var(--space-6); }
  .del-icon{ width:46px; height:46px; border-radius:var(--radius); background:var(--red-tint); color:var(--red); display:grid; place-items:center; font-size:22px; margin-bottom:var(--space-4); }
  .del-title{ font-size:var(--text-2xl); font-weight:700; }
  .del-msg{ font-size:var(--text-md); color:var(--ink-3); line-height:1.6; margin:8px 0 var(--space-5); }
  .del-actions{ display:flex; justify-content:flex-end; gap:var(--space-3); margin-top:var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  (function () { const real = ReactDOM.createRoot.bind(ReactDOM);
    ReactDOM.createRoot = function () { return { render() {}, unmount() {} }; };
    window.__restoreCreateRoot = function () { ReactDOM.createRoot = real; }; })();
</script>
<script src="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/_ds_bundle.js"></script>
<script>window.__restoreCreateRoot();</script>
<script src="app/data.js"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel">
const { Button } = window.TaskmasterProDesignSystem_b94546;
const NOP = window.NOP;
const { useState } = React;

function Field({ label, hint, children }) {
  return <div className="fld"><label className="fld-label">{label}</label>{children}{hint ? <span className="fld-hint">{hint}</span> : null}</div>;
}
function ToggleRow({ label, hint, checked, onChange }) {
  return (
    <div className="set-row">
      <div><div className="set-label">{label}</div><div className="set-hint">{hint}</div></div>
      <window.Switch checked={checked} onChange={onChange} />
    </div>
  );
}

function Settings() {
  const biz = NOP.business;
  const [p, setP] = useState({
    full_name: biz.owner, business_name: biz.name, tagline: 'Web Design & Consultation',
    address1: biz.line1, address2: biz.line2, phone: biz.phone, email: biz.email,
    default_rate: 75, payment_terms: 'Net 14',
    notes_default: 'Payment is due within 14 days of the invoice date. Thank you for your business!',
    show_discount: false, show_tax: true, tax_rate: 7, show_notes: true,
    notif_due: true, notif_paid: true, notif_weekly: false,
  });
  const set = (k) => (e) => setP(s => ({ ...s, [k]: e && e.target ? e.target.value : e }));
  const setBool = (k) => (v) => setP(s => ({ ...s, [k]: v }));
  const [saved, setSaved] = useState(false);
  const [delOpen, setDelOpen] = useState(false);

  const save = () => { setSaved(true); setTimeout(() => setSaved(false), 1600); };

  const actions = (
    <Button variant="primary" onClick={save}>
      <i className={'ph ' + (saved ? 'ph-check' : 'ph-floppy-disk')} style={{ fontSize: 15 }}></i> {saved ? 'Saved' : 'Save changes'}
    </Button>
  );

  return (
    <window.AppShell active="settings" title="Settings"
                     description="Manage your business profile, defaults, and account." actions={actions} maxWidth={760}>
      <div className="settings-wrap sections">

        {/* Business profile */}
        <section className="card">
          <div className="card-head"><div><h2 className="card-title">Business profile</h2><p className="card-sub">This info appears on your invoices</p></div></div>
          <div className="card-body">
            <div className="stack">
              <div className="logo-section">
                <div className="logo-preview"><img src="numbers-on-paper-assets/mark/mark-primary.svg" alt="Logo" /></div>
                <div className="logo-actions">
                  <button className="logo-upload"><i className="ph ph-upload-simple"></i> Change logo</button>
                  <p className="fld-hint">PNG, JPG or SVG · shown on every invoice</p>
                </div>
              </div>
              <div className="row2">
                <Field label="Your name"><input className="fld-input" value={p.full_name} onChange={set('full_name')} /></Field>
                <Field label="Business name"><input className="fld-input" value={p.business_name} onChange={set('business_name')} /></Field>
              </div>
              <Field label="Tagline"><input className="fld-input" value={p.tagline} onChange={set('tagline')} /></Field>
              <div className="row2">
                <Field label="Address line 1"><input className="fld-input" value={p.address1} onChange={set('address1')} /></Field>
                <Field label="Address line 2"><input className="fld-input" value={p.address2} onChange={set('address2')} /></Field>
              </div>
              <div className="row2">
                <Field label="Phone"><input className="fld-input fld-mono" value={p.phone} onChange={set('phone')} /></Field>
                <Field label="Email"><input className="fld-input" type="email" value={p.email} onChange={set('email')} /></Field>
              </div>
            </div>
          </div>
        </section>

        {/* Invoice defaults */}
        <section className="card">
          <div className="card-head"><div><h2 className="card-title">Invoice defaults</h2><p className="card-sub">Applied automatically to new invoices</p></div></div>
          <div className="card-body">
            <div className="stack">
              <div className="row2">
                <Field label="Default rate ($)"><input className="fld-input fld-mono" type="number" min="0" value={p.default_rate} onChange={set('default_rate')} /></Field>
                <Field label="Payment terms"><input className="fld-input" value={p.payment_terms} onChange={set('payment_terms')} /></Field>
              </div>
              <Field label="Default notes / terms"><textarea className="fld-textarea" value={p.notes_default} onChange={set('notes_default')}></textarea></Field>
            </div>
          </div>
        </section>

        {/* Template options */}
        <section className="card">
          <div className="card-head"><div><h2 className="card-title">Template options</h2><p className="card-sub">Sections shown on invoices by default</p></div></div>
          <div className="card-body">
            <div className="set-toggles">
              <ToggleRow label="Show discount field" hint="Add a discount line to invoices." checked={p.show_discount} onChange={setBool('show_discount')} />
              <ToggleRow label="Show tax" hint="Add a tax line to invoices." checked={p.show_tax} onChange={setBool('show_tax')} />
              {p.show_tax && (
                <div className="set-row" style={{ borderBottom: '1px solid var(--line-soft)' }}>
                  <div><div className="set-label">Default tax rate</div><div className="set-hint">Used when tax is enabled.</div></div>
                  <div style={{ width: 120 }}><input className="fld-input fld-mono" type="number" min="0" max="100" step="0.1" value={p.tax_rate} onChange={set('tax_rate')} /></div>
                </div>
              )}
              <ToggleRow label="Show notes & terms" hint="Include a notes section at the bottom." checked={p.show_notes} onChange={setBool('show_notes')} />
            </div>
          </div>
        </section>

        {/* Account & security */}
        <section className="card">
          <div className="card-head"><div><h2 className="card-title">Account &amp; security</h2><p className="card-sub">Password and two-factor authentication</p></div></div>
          <div className="card-body">
            <div className="subsec-head"><i className="ph ph-lock-key"></i><div><div className="subsec-title">Change password</div><div className="subsec-hint">Use at least 8 characters.</div></div></div>
            <div className="stack">
              <Field label="Current password"><input className="fld-input" type="password" placeholder="••••••••" /></Field>
              <div className="row2">
                <Field label="New password"><input className="fld-input" type="password" placeholder="••••••••" /></Field>
                <Field label="Confirm new password"><input className="fld-input" type="password" placeholder="••••••••" /></Field>
              </div>
              <div><Button variant="ghost" size="sm">Update password</Button></div>
            </div>
            <div className="set-divider"></div>
            <div className="subsec-head">
              <i className="ph ph-shield-check"></i>
              <div><div className="subsec-title">Two-factor authentication</div><div className="subsec-hint">Add an extra layer of security when signing in.</div></div>
              <span className="mfa-badge mfa-badge--off">Disabled</span>
            </div>
            <Button variant="ghost" size="sm"><i className="ph ph-plus"></i> Enable 2FA</Button>
          </div>
        </section>

        {/* Email notifications */}
        <section className="card">
          <div className="card-head"><div><h2 className="card-title">Email notifications</h2><p className="card-sub">Choose which emails you receive</p></div></div>
          <div className="card-body">
            <div className="set-toggles">
              <ToggleRow label="Invoice due reminders" hint="Get notified when a client invoice is approaching its due date." checked={p.notif_due} onChange={setBool('notif_due')} />
              <ToggleRow label="Payment received" hint="Confirmation email when you mark an invoice as paid." checked={p.notif_paid} onChange={setBool('notif_paid')} />
              <ToggleRow label="Weekly summary" hint="A weekly overview of activity and outstanding balances." checked={p.notif_weekly} onChange={setBool('notif_weekly')} />
            </div>
          </div>
        </section>

        {/* Danger zone */}
        <section className="card danger-card">
          <div className="card-head"><div><h2 className="card-title">Danger zone</h2><p className="card-sub">Irreversible account actions</p></div></div>
          <div className="card-body">
            <div className="danger-row">
              <div>
                <div className="danger-label">Delete account</div>
                <div className="danger-text">Permanently delete your account and all invoices, clients, and data. This cannot be undone.</div>
              </div>
              <Button variant="danger" size="sm" onClick={() => setDelOpen(true)}><i className="ph ph-trash"></i> Delete account</Button>
            </div>
          </div>
        </section>
      </div>

      {delOpen && (
        <div className="del-overlay" onClick={() => setDelOpen(false)}>
          <div className="del-modal" onClick={e => e.stopPropagation()}>
            <div className="del-icon"><i className="ph ph-trash"></i></div>
            <h2 className="del-title">Delete account</h2>
            <p className="del-msg">This will permanently delete your account, all invoices, and client data. This action <strong>cannot be undone</strong>.</p>
            <Field label="Enter your password to confirm"><input className="fld-input" type="password" placeholder="••••••••" /></Field>
            <div className="del-actions">
              <Button variant="ghost" size="sm" onClick={() => setDelOpen(false)}>Cancel</Button>
              <Button variant="danger" size="sm" onClick={() => setDelOpen(false)}>Delete my account</Button>
            </div>
          </div>
        </div>
      )}
    </window.AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Settings />);
</script>
</body>
</html>
