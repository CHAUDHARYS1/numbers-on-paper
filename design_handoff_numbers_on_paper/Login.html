<script>
  (function () { const real = ReactDOM.createRoot.bind(ReactDOM);
    ReactDOM.createRoot = function () { return { render() {}, unmount() {} }; };
    window.__restoreCreateRoot = function () { ReactDOM.createRoot = real; }; })();

<script src="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/_ds_bundle.js"></script>

<script type="text/babel" src="app/auth.jsx"></script>
<script type="text/babel">
const { Button } = window.TaskmasterProDesignSystem_b94546;
const { useState } = React;

function Login() {
  const [email, setEmail]   = useState('');
  const [pw, setPw]         = useState('');
  const [error, setError]   = useState('');
  const [loading, setLoad]  = useState(false);

  const submit = (e) => {
    e.preventDefault();
    if (!email.trim() || !pw) { setError('Enter your email and password to continue.'); return; }
    setError(''); setLoad(true);
    setTimeout(() => { location.href = 'Dashboard.html'; }, 600);
  };

  return (
    <div className="auth-split">
      <window.AuthBrand />
      <div className="auth-right">
        <div className="auth-card">
          <a className="auth-card-logo" href="Landing Page.html"><img src="numbers-on-paper-assets/lockup/logo-horizontal.svg" alt="Numbers on Paper" /></a>
          <h1 className="auth-title">Welcome back</h1>
          <p className="auth-sub">Sign in to your workspace to keep invoicing.</p>

          <form className="auth-form" onSubmit={submit} noValidate>
            <window.AuthField label="Email" type="email" value={email} onChange={setEmail} placeholder="you@example.com" autoComplete="email" autoFocus />
            <div>
              <div className="auth-row-between" style={{ marginBottom: 6 }}>
                <label className="fld-label" style={{ margin: 0 }}>Password</label>
                <span className="auth-link">Forgot password?</span>
              </div>
              <window.AuthPasswordField value={pw} onChange={setPw} placeholder="••••••••" autoComplete="current-password" />
            </div>
            {error ? <div className="auth-error"><i className="ph ph-warning-circle"></i>{error}</div> : null}
            <Button type="submit" variant="primary" block disabled={loading}>
              {loading ? 'Signing in…' : 'Sign in'}
            </Button>
          </form>

          <div className="auth-divider">or</div>
          <window.GoogleButton>Continue with Google</window.GoogleButton>

          <p className="auth-switch">No account yet? <a href="Signup.html">Create one free</a></p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
</script>
</body>
</html>
