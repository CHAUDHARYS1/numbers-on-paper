<script type="text/babel">
const { Button } = window.TaskmasterProDesignSystem_b94546;
const NOP = window.NOP;

function Preview() {
  const params = new URLSearchParams(location.search);
  const inv = NOP.invoices.find(i => i.id === params.get('id')) || NOP.invoices[0];
  const data = window.buildInvoiceData(inv);

  const actions = (
    <>
      <Button variant="ghost" onClick={() => location.href = 'InvoiceEditor.html?id=' + inv.id}><i className="ph ph-pencil-simple" style={{ fontSize: 15 }}></i> Edit</Button>
      <Button variant="primary" onClick={() => window.print()}><i className="ph ph-printer" style={{ fontSize: 15 }}></i> Print / PDF</Button>
    </>
  );

  return (
    <window.AppShell active="invoices" title={inv.invoice_number}
                     description={'Issued to ' + (data.billTo.name || '—')} actions={actions} maxWidth={920}>
      <a className="back-link" href="Invoices.html" style={{ marginBottom: 'var(--space-5)', display: 'inline-flex' }}>
        <i className="ph ph-arrow-left"></i> Back to invoices
      </a>
      <div className="paper-stage">
        <window.InvoiceDoc data={data} />
      </div>
    </window.AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
</script>
