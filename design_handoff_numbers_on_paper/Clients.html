<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Numbers on Paper — Clients</title>
<link rel="icon" href="numbers-on-paper-assets/favicon/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

<link rel="stylesheet" href="app/app.css" />
<link rel="stylesheet" href="app/forms.css" />
<style>
  .cl-summary{ display:flex; gap:var(--space-6); margin-bottom:var(--space-5); flex-wrap:wrap; }
  .cl-summary .s{ display:flex; flex-direction:column; gap:2px; }
  .cl-summary .s-val{ font-family:var(--font-mono); font-size:var(--text-2xl); font-weight:700; color:var(--ink); letter-spacing:-.01em; }
  .cl-summary .s-lbl{ font-size:var(--text-body); color:var(--ink-4); }
  .cl-summary .div{ width:1px; background:var(--line); align-self:stretch; }

  .cl-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }
  @media (max-width:1080px){ .cl-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:680px){ .cl-grid{ grid-template-columns:1fr; } }

  .cl-card{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow-card); padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-4); transition:box-shadow .18s, transform .12s; }
  .cl-card:hover{ box-shadow:0 4px 18px rgba(0,0,0,.09),0 1px 4px rgba(0,0,0,.05); }
  .cl-head{ display:flex; align-items:center; gap:var(--space-3); }
  .cl-head > div{ flex:1; min-width:0; }
  .cl-name{ font-size:var(--text-lg); font-weight:700; color:var(--ink); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cl-city{ font-size:var(--text-body); color:var(--ink-4); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cl-contact{ display:flex; flex-direction:column; gap:5px; font-size:var(--text-body); color:var(--ink-3); }
  .cl-contact .r{ display:flex; align-items:center; gap:var(--space-2); min-width:0; }
  .cl-contact .r span, .cl-contact .r{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cl-contact .r i{ font-size:15px; color:var(--ink-4); width:16px; }
  .cl-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-2); padding:var(--space-3) 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
  .cl-stat{ display:flex; flex-direction:column; gap:2px; }
  .cl-stat .v{ font-family:var(--font-mono); font-size:var(--text-md); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .cl-stat .v.due{ color:var(--amber); }
  .cl-stat .v.zero{ color:var(--ink-4); }
  .cl-stat .l{ font-size:10px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--ink-4); }
  .cl-actions{ display:flex; gap:var(--space-2); }
  .cl-actions a{ flex:1; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.32); display:flex; align-items:center; justify-content:center; z-index:100; padding:var(--space-5); animation:mfade .18s ease; }
  @keyframes mfade{ from{opacity:0} to{opacity:1} }
  .modal-box{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-float); width:100%; max-width:460px; overflow:hidden; }
  .modal-h{ display:flex; align-items:center; justify-content:space-between; padding:var(--space-4) var(--space-5); background:var(--surface); border-bottom:1px solid var(--line); }
  .modal-h h3{ font-size:var(--text-xl); font-weight:600; }
  .modal-x{ background:none; border:none; font-size:20px; color:var(--ink-4); cursor:pointer; line-height:1; padding:2px 6px; border-radius:var(--radius-sm); }
  .modal-x:hover{ color:var(--ink); background:var(--paper-2); }
  .modal-b{ padding:var(--space-5); }
  .modal-f{ display:flex; justify-content:flex-end; gap:var(--space-3); padding:var(--space-3) var(--space-5); background:var(--surface); border-top:1px solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  (function () { const real = ReactDOM.createRoot.bind(ReactDOM);
    ReactDOM.createRoot = function () { return { render() {}, unmount() {} }; };
    window.__restoreCreateRoot = function () { ReactDOM.createRoot = real; }; })();
</script>
<script src="_ds/taskmaster-pro-design-system-b9454641-38e8-4179-9b0f-5f011489399c/_ds_bundle.js"></script>
<script>window.__restoreCreateRoot();</script>
<script src="app/data.js"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel">
const { Avatar, Button } = window.TaskmasterProDesignSystem_b94546;
const NOP = window.NOP;
const { fmt, fmt0, effStatus } = NOP;
const { useState, useMemo } = React;

// Build client list with derived stats from the invoice data
function buildClients() {
  return Object.entries(NOP.clients).map(([key, c]) => {
    const inv = NOP.invoices.filter(i => i.client === key);
    const billed = inv.filter(i => i.status !== 'draft').reduce((s, i) => s + i.total, 0);
    const outstanding = inv.filter(i => i.status === 'unpaid').reduce((s, i) => s + i.total, 0);
    const last = inv.map(i => i.issue_date).filter(Boolean).sort().pop();
    return { key, ...c, count: inv.length, billed, outstanding, last };
  }).sort((a, b) => b.billed - a.billed);
}

function Field({ label, children }) {
  return <div className="fld"><label className="fld-label">{label}</label>{children}</div>;
}

function Clients() {
  const [clients, setClients] = useState(buildClients);
  const [search, setSearch]   = useState('');
  const [addOpen, setAddOpen] = useState(false);
  const [draft, setDraft]     = useState({ name: '', contact: '', email: '', city: '' });

  const view = useMemo(() => {
    const q = search.toLowerCase();
    return clients.filter(c => !q || c.name.toLowerCase().includes(q) || (c.contact || '').toLowerCase().includes(q) || (c.city || '').toLowerCase().includes(q));
  }, [clients, search]);

  const totalBilled = clients.reduce((s, c) => s + c.billed, 0);
  const totalOut    = clients.reduce((s, c) => s + c.outstanding, 0);

  const addClient = () => {
    if (!draft.name.trim()) return;
    const key = 'new_' + Math.random().toString(36).slice(2, 7);
    setClients(cs => [{ key, name: draft.name.trim(), contact: draft.contact, email: draft.email, city: draft.city, count: 0, billed: 0, outstanding: 0, last: null }, ...cs]);
    setDraft({ name: '', contact: '', email: '', city: '' });
    setAddOpen(false);
  };

  const actions = (
    <>
      <div className="topbar-search">
        <i className="ph ph-magnifying-glass"></i>
        <input placeholder="Search clients…" value={search} onChange={e => setSearch(e.target.value)} aria-label="Search clients" />
      </div>
      <Button variant="primary" onClick={() => setAddOpen(true)}><i className="ph ph-plus" style={{ fontSize: 16 }}></i> Add client</Button>
    </>
  );

  return (
    <window.AppShell active="clients" title="Clients"
                     description="Everyone you bill, with their history at a glance." actions={actions} maxWidth={1120}>
      <div className="cl-summary">
        <div className="s"><span className="s-val">{clients.length}</span><span className="s-lbl">Clients</span></div>
        <div className="div"></div>
        <div className="s"><span className="s-val">{fmt0(totalBilled)}</span><span className="s-lbl">Total billed</span></div>
        <div className="div"></div>
        <div className="s"><span className="s-val" style={{ color: totalOut ? 'var(--amber)' : 'var(--ink)' }}>{fmt0(totalOut)}</span><span className="s-lbl">Outstanding</span></div>
      </div>

      {view.length === 0 ? (
        <div className="card"><div className="empty-state">
          <p className="es-title">No clients found</p>
          <p className="es-sub">Try a different search, or add a new client.</p>
          <Button variant="ghost" onClick={() => setSearch('')}>Clear search</Button>
        </div></div>
      ) : (
        <div className="cl-grid">
          {view.map(c => (
            <div className="cl-card" key={c.key}>
              <div className="cl-head">
                <Avatar name={c.name} userId={c.key} size="lg" />
                <div>
                  <div className="cl-name">{c.name}</div>
                  <div className="cl-city">{c.city || '—'}</div>
                </div>
              </div>
              <div className="cl-contact">
                {c.contact ? <div className="r"><i className="ph ph-user"></i> {c.contact}</div> : null}
                {c.email ? <div className="r"><i className="ph ph-envelope-simple"></i> {c.email}</div> : null}
              </div>
              <div className="cl-stats">
                <div className="cl-stat"><span className={'v' + (c.count ? '' : ' zero')}>{c.count}</span><span className="l">Invoices</span></div>
                <div className="cl-stat"><span className={'v' + (c.billed ? '' : ' zero')}>{fmt0(c.billed)}</span><span className="l">Billed</span></div>
                <div className="cl-stat"><span className={'v' + (c.outstanding ? ' due' : ' zero')}>{fmt0(c.outstanding)}</span><span className="l">Due</span></div>
              </div>
              <div className="cl-actions">
                <a href="InvoiceEditor.html"><Button variant="ghost" size="sm" block><i className="ph ph-plus"></i> Invoice</Button></a>
                <a href="Invoices.html"><Button variant="ghost" size="sm" block>View all</Button></a>
              </div>
            </div>
          ))}
        </div>
      )}

      {addOpen && (
        <div className="modal-overlay" onClick={() => setAddOpen(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-h"><h3>Add client</h3><button className="modal-x" onClick={() => setAddOpen(false)} aria-label="Close">×</button></div>
            <div className="modal-b">
              <div className="stack">
                <Field label="Client name"><input className="fld-input" placeholder="Company or person" value={draft.name} onChange={e => setDraft(d => ({ ...d, name: e.target.value }))} autoFocus /></Field>
                <div className="row2">
                  <Field label="Contact"><input className="fld-input" placeholder="Jane Smith" value={draft.contact} onChange={e => setDraft(d => ({ ...d, contact: e.target.value }))} /></Field>
                  <Field label="City"><input className="fld-input" placeholder="City, ST" value={draft.city} onChange={e => setDraft(d => ({ ...d, city: e.target.value }))} /></Field>
                </div>
                <Field label="Email"><input className="fld-input" type="email" placeholder="jane@company.com" value={draft.email} onChange={e => setDraft(d => ({ ...d, email: e.target.value }))} /></Field>
              </div>
            </div>
            <div className="modal-f">
              <Button variant="ghost" size="sm" onClick={() => setAddOpen(false)}>Cancel</Button>
              <Button variant="primary" size="sm" onClick={addClient}>Save client</Button>
            </div>
          </div>
        </div>
      )}
    </window.AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Clients />);
</script>
</body>
</html>
