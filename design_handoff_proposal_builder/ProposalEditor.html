<script type="text/babel">
const { Button } = window.TaskmasterProDesignSystem_b94546;
const NOP = window.NOP;
const { fmt } = NOP;
const { useState, useMemo, useEffect, useRef, useLayoutEffect } = React;

const uid = () => Math.random().toString(36).slice(2, 9);
const blankItem = () => ({ id: uid(), description: '', qty: 1, rate: 0 });

const TERMS_SNIPPETS = [
  { label: '50% deposit', text: 'A 50% deposit is required to reserve the project start date; the remaining balance is due upon final delivery. This proposal is valid for 30 days from the date above.' },
  { label: 'Milestones', text: 'Payment is split across three milestones: 40% at kickoff, 30% at design sign-off, and 30% on launch. Invoices are due within 14 days of issue.' },
  { label: 'Net 30', text: 'All invoices are payable within 30 days. Work begins upon written approval of this proposal. Scope changes are billed separately at the agreed hourly rate.' },
];

function Field({ label, hint, children }) {
  return <div className="fld"><label className="fld-label">{label}</label>{children}{hint ? <span className="fld-hint">{hint}</span> : null}</div>;
}

/* Repeatable single-line list editor (deliverables, objectives) */
function ListEditor({ items, onChange, placeholder, addLabel }) {
  const set = (i, v) => onChange(items.map((it, idx) => idx === i ? v : it));
  const add = () => onChange([...items, '']);
  const del = (i) => onChange(items.length > 1 ? items.filter((_, idx) => idx !== i) : ['']);
  return (
    <div className="stack" style={{ gap: 'var(--space-3)' }}>
      <div className="listed">
        {items.map((it, i) => (
          <div className="listed-row" key={i}>
            <i className="ph ph-dots-six-vertical li-handle"></i>
            <input className="fld-input" value={it} placeholder={placeholder} onChange={e => set(i, e.target.value)} />
            <button className="li-del" onClick={() => del(i)} aria-label="Remove"><i className="ph ph-trash"></i></button>
          </div>
        ))}
      </div>
      <Button variant="ghost" size="sm" onClick={add}><i className="ph ph-plus"></i> {addLabel}</Button>
    </div>
  );
}

/* Scaled live-preview paper that fits its column width */
function ScaledPaper({ children, designWidth = 760 }) {
  const frame = useRef(null);
  const inner = useRef(null);
  const [scale, setScale] = useState(1);
  const [h, setH] = useState(0);
  useLayoutEffect(() => {
    const recompute = () => {
      if (!frame.current || !inner.current) return;
      const avail = frame.current.clientWidth - 2; // minus hairline
      const s = Math.min(1, avail / designWidth);
      setScale(s);
      setH(inner.current.offsetHeight * s);
    };
    recompute();
    const roF = new ResizeObserver(recompute);
    const roI = new ResizeObserver(recompute);
    if (frame.current) roF.observe(frame.current);
    if (inner.current) roI.observe(inner.current);
    return () => { roF.disconnect(); roI.disconnect(); };
  }, []);
  return (
    <div className="pe-paper-frame" ref={frame} style={{ height: h ? h + (16 * 2) : 'auto' }}>
      <div className="pe-paper-scale" ref={inner} style={{ width: designWidth, transform: `scale(${scale})` }}>
        {children}
      </div>
    </div>
  );
}

/* The toggleable sections, in document order */
const SECTION_DEFS = [
  { key: 'intro',        name: 'Introduction',       hint: 'Opening note to the client' },
  { key: 'scope',        name: 'Scope of work',      hint: 'Overview & objectives' },
  { key: 'deliverables', name: 'Deliverables',       hint: 'What they receive' },
  { key: 'investment',   name: 'Investment',         hint: 'Pricing & line items' },
  { key: 'timeline',     name: 'Timeline',           hint: 'Phases & milestones' },
  { key: 'terms',        name: 'Terms & conditions', hint: 'Payment & legal terms' },
  { key: 'acceptance',   name: 'Acceptance',         hint: 'Signature block' },
];

function Editor() {
  const [number] = useState('PROP-0007');
  const [title, setTitle]   = useState('Website redesign & brand refresh');
  const [status, setStatus] = useState('draft');
  const [issue, setIssue]   = useState(NOP.TODAY);
  const [valid, setValid]   = useState('2026-07-13');

  const [clientKey, setClientKey] = useState('northwind');
  const c0 = NOP.clients.northwind;
  const [client, setClient] = useState({ name: c0.name, contact: c0.contact, email: c0.email, city: c0.city });

  const [sections, setSections] = useState({
    intro: true, scope: true, deliverables: true, investment: true, timeline: true, terms: true, acceptance: true,
  });
  const toggleSection = (k) => setSections(s => ({ ...s, [k]: !s[k] }));

  const [introText, setIntroText] = useState("Thank you for the opportunity to partner on this project. This proposal outlines our recommended approach, deliverables, and investment to bring your new website and refreshed brand to life — built to convert visitors and scale with your business.");
  const [scopeText, setScopeText] = useState("We'll redesign your marketing site end-to-end: a clear messaging hierarchy, a modern responsive design system, and a fast, accessible build. The work is organized into discovery, design, and development phases with collaborative checkpoints throughout.");
  const [objectives, setObjectives] = useState([
    'Clarify the brand story and visual identity',
    'Increase qualified inbound leads from the site',
    'Establish a reusable design system for future pages',
  ]);
  const [deliverables, setDeliverables] = useState([
    'Brand & messaging guidelines (PDF)',
    'Responsive design system in Figma',
    'Fully built marketing site — up to 8 pages',
    'CMS setup with editor training',
    '30 days of post-launch support',
  ]);

  const [items, setItems] = useState([
    { id: uid(), description: 'Discovery & strategy workshop', note: 'Stakeholder interviews, audit, roadmap', qty: 1, rate: 2400 },
    { id: uid(), description: 'UX/UI design system', note: 'Wireframes, hi-fi design, components', qty: 1, rate: 5600 },
    { id: uid(), description: 'Frontend build & CMS', note: 'Responsive build, CMS, QA', qty: 1, rate: 6800 },
  ]);
  const [showTax, setShowTax] = useState(true);
  const [taxRate, setTaxRate] = useState(7);

  const [timeline, setTimeline] = useState([
    { phase: 'Discovery & strategy', duration: 'Week 1–2' },
    { phase: 'Design & sign-off', duration: 'Week 3–5' },
    { phase: 'Build & QA', duration: 'Week 6–8' },
    { phase: 'Launch & handoff', duration: 'Week 9' },
  ]);

  const [termsText, setTermsText] = useState(TERMS_SNIPPETS[1].text);

  const [previewOpen, setPreviewOpen] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);

  useEffect(() => {
    const h = e => { if (e.key === 'Escape') setPreviewOpen(false); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, []);

  const pickClient = (key) => {
    setClientKey(key);
    const c = NOP.clients[key];
    if (c) setClient({ name: c.name, contact: c.contact, email: c.email, city: c.city });
  };

  const setItem = (id, field, val) => setItems(its => its.map(it => it.id === id ? { ...it, [field]: val } : it));
  const addItem = () => setItems(its => [...its, blankItem()]);
  const delItem = (id) => setItems(its => its.length > 1 ? its.filter(it => it.id !== id) : its);

  const setMile = (i, field, val) => setTimeline(t => t.map((m, idx) => idx === i ? { ...m, [field]: val } : m));
  const addMile = () => setTimeline(t => [...t, { phase: '', duration: '' }]);
  const delMile = (i) => setTimeline(t => t.length > 1 ? t.filter((_, idx) => idx !== i) : t);

  const lineItems = items.map(it => ({ ...it, qty: +it.qty || 0, rate: +it.rate || 0, amount: (+it.qty || 0) * (+it.rate || 0) }));
  const subtotal = lineItems.reduce((s, it) => s + it.amount, 0);
  const taxAmt = showTax ? +(subtotal * (taxRate / 100)).toFixed(2) : 0;
  const total = +(subtotal + taxAmt).toFixed(2);

  const docData = {
    number, title, status, issue_date: issue, valid_until: valid,
    preparedBy: NOP.business, preparedFor: client,
    sections,
    introText, scopeText, objectives,
    deliverables,
    items: lineItems, subtotal, taxRate: taxRate / 100, taxAmt, total, showTax,
    timeline, termsText,
  };

  const save = () => { setSavedFlash(true); setTimeout(() => setSavedFlash(false), 1600); };

  const actions = (
    <>
      <Button variant="ghost" onClick={() => setPreviewOpen(true)}><i className="ph ph-arrows-out" style={{ fontSize: 15 }}></i> Preview</Button>
      <Button variant="ghost" onClick={() => window.print()}><i className="ph ph-file-pdf" style={{ fontSize: 15 }}></i> Export PDF</Button>
      <Button variant="primary" onClick={save}>
        <i className={'ph ' + (savedFlash ? 'ph-check' : 'ph-floppy-disk')} style={{ fontSize: 15 }}></i>
        {savedFlash ? 'Saved' : 'Save proposal'}
      </Button>
    </>
  );

  /* a form section card that dims + collapses when toggled off */
  const SectionCard = ({ sk, title, action, children }) => (
    <section className={'card' + (sections[sk] ? '' : ' card--off')}>
      <div className="card-head">
        <h2 className="card-title">{title}</h2>
        <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)' }}>
          {sections[sk] ? action : <span className="card-head-flag">Hidden</span>}
          <window.Switch checked={sections[sk]} onChange={() => toggleSection(sk)} />
        </div>
      </div>
      <div className="card-body">{children}</div>
    </section>
  );

  return (
    <window.AppShell active="proposals" title="New proposal"
                     description="Fill in the details, toggle sections, and preview." actions={actions} maxWidth={1320}>
      <a className="back-link" href="Invoices.html" style={{ display: 'inline-flex', marginBottom: 'var(--space-5)' }}><i className="ph ph-arrow-left"></i> Back</a>

      <div className="pe-grid">
        {/* ── FORM ── */}
        <div className="pe-form">

          {/* Proposal details */}
          <section className="card">
            <div className="card-head"><h2 className="card-title">Proposal details</h2></div>
            <div className="card-body">
              <div className="stack">
                <Field label="Proposal title"><input className="fld-input" value={title} placeholder="e.g. Website redesign & brand refresh" onChange={e => setTitle(e.target.value)} /></Field>
                <div className="row2">
                  <Field label="Proposal number"><input className="fld-input fld-mono" value={number} readOnly /></Field>
                  <Field label="Status">
                    <select className="fld-select" value={status} onChange={e => setStatus(e.target.value)}>
                      <option value="draft">Draft</option><option value="sent">Sent</option>
                      <option value="accepted">Accepted</option><option value="declined">Declined</option>
                    </select>
                  </Field>
                </div>
                <div className="row2">
                  <Field label="Date"><input className="fld-input fld-mono" type="date" value={issue} onChange={e => setIssue(e.target.value)} /></Field>
                  <Field label="Valid until"><input className="fld-input fld-mono" type="date" value={valid} onChange={e => setValid(e.target.value)} /></Field>
                </div>
              </div>
            </div>
          </section>

          {/* Prepared for */}
          <section className="card">
            <div className="card-head"><h2 className="card-title">Prepared for</h2></div>
            <div className="card-body">
              <div className="stack">
                <Field label="Saved client" hint="Pick a saved client to autofill, or type a new one below.">
                  <select className="fld-select" value={clientKey} onChange={e => pickClient(e.target.value)}>
                    <option value="">New client…</option>
                    {Object.entries(NOP.clients).map(([k, c]) => <option key={k} value={k}>{c.name}</option>)}
                  </select>
                </Field>
                <div className="row2">
                  <Field label="Client name"><input className="fld-input" placeholder="Company or person" value={client.name} onChange={e => setClient(c => ({ ...c, name: e.target.value }))} /></Field>
                  <Field label="Contact"><input className="fld-input" placeholder="Jane Smith" value={client.contact} onChange={e => setClient(c => ({ ...c, contact: e.target.value }))} /></Field>
                </div>
                <div className="row2">
                  <Field label="Email"><input className="fld-input" type="email" placeholder="jane@company.com" value={client.email} onChange={e => setClient(c => ({ ...c, email: e.target.value }))} /></Field>
                  <Field label="City"><input className="fld-input" placeholder="City, ST" value={client.city} onChange={e => setClient(c => ({ ...c, city: e.target.value }))} /></Field>
                </div>
              </div>
            </div>
          </section>

          {/* Sections toggle panel */}
          <section className="card">
            <div className="card-head">
              <h2 className="card-title">Sections</h2>
              <span className="card-sub">Toggle what appears in the proposal</span>
            </div>
            <div className="card-body">
              <div className="sectoggles">
                {SECTION_DEFS.map(s => (
                  <label key={s.key} className={'sectoggle' + (sections[s.key] ? '' : ' sectoggle--off')}>
                    <window.Switch checked={sections[s.key]} onChange={() => toggleSection(s.key)} />
                    <div className="sectoggle-txt">
                      <div className="sectoggle-name">{s.name}</div>
                      <div className="sectoggle-hint">{s.hint}</div>
                    </div>
                  </label>
                ))}
              </div>
            </div>
          </section>

          {/* Introduction */}
          <SectionCard sk="intro" title="Introduction">
            <textarea className="fld-textarea" value={introText} onChange={e => setIntroText(e.target.value)} placeholder="Open with a warm note about the project and your approach…"></textarea>
          </SectionCard>

          {/* Scope of work */}
          <SectionCard sk="scope" title="Scope of work">
            <div className="stack">
              <Field label="Overview"><textarea className="fld-textarea" value={scopeText} onChange={e => setScopeText(e.target.value)} placeholder="Describe the work at a high level…"></textarea></Field>
              <Field label="Objectives"><ListEditor items={objectives} onChange={setObjectives} placeholder="e.g. Increase qualified leads" addLabel="Add objective" /></Field>
            </div>
          </SectionCard>

          {/* Deliverables */}
          <SectionCard sk="deliverables" title="Deliverables">
            <ListEditor items={deliverables} onChange={setDeliverables} placeholder="e.g. Responsive design system in Figma" addLabel="Add deliverable" />
          </SectionCard>

          {/* Investment */}
          <SectionCard sk="investment" title="Investment"
            action={<Button variant="ghost" size="sm" onClick={addItem}><i className="ph ph-plus"></i> Add item</Button>}>
            <div style={{ margin: '0 calc(-1 * var(--space-5))' }}>
              <div className="li-table">
                <div className="li-head">
                  <span>Description</span><span>Notes</span><span style={{ textAlign: 'right' }}>Qty</span>
                  <span style={{ textAlign: 'right' }}>Rate</span><span style={{ textAlign: 'right' }}>Amount</span><span></span>
                </div>
                {lineItems.map(it => (
                  <div className="li-row" key={it.id}>
                    <input className="li-cell" placeholder="e.g. UX/UI design system" value={it.description} onChange={e => setItem(it.id, 'description', e.target.value)} />
                    <input className="li-cell" placeholder="Optional detail" value={it.note || ''} onChange={e => setItem(it.id, 'note', e.target.value)} />
                    <input className="li-cell li-num" type="number" min="0" value={it.qty} onChange={e => setItem(it.id, 'qty', e.target.value)} />
                    <input className="li-cell li-num" type="number" min="0" value={it.rate} onChange={e => setItem(it.id, 'rate', e.target.value)} />
                    <span className="li-amount">{fmt(it.amount)}</span>
                    <button className="li-del" onClick={() => delItem(it.id)} disabled={items.length === 1} aria-label="Remove item"><i className="ph ph-trash"></i></button>
                  </div>
                ))}
              </div>
            </div>
            <div className="opt-toggles" style={{ marginTop: 'var(--space-5)', marginBottom: 0 }}>
              <label className="opt-toggle"><window.Switch checked={showTax} onChange={setShowTax} /> Apply tax</label>
              {showTax && (
                <div style={{ maxWidth: 160 }}>
                  <Field label="Tax rate (%)"><input className="fld-input fld-mono" type="number" min="0" max="100" step="0.1" value={taxRate} onChange={e => setTaxRate(+e.target.value || 0)} /></Field>
                </div>
              )}
            </div>
            <div className="totals">
              <div className="total-row"><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
              {showTax && <div className="total-row"><span>Tax ({taxRate}%)</span><span>{fmt(taxAmt)}</span></div>}
              <div className="total-row total-grand"><span>Total</span><span>{fmt(total)}</span></div>
            </div>
          </SectionCard>

          {/* Timeline */}
          <SectionCard sk="timeline" title="Timeline"
            action={<Button variant="ghost" size="sm" onClick={addMile}><i className="ph ph-plus"></i> Add phase</Button>}>
            <div className="stack" style={{ gap: 'var(--space-3)' }}>
              {timeline.map((m, i) => (
                <div className="mile-row" key={i}>
                  <input className="fld-input" placeholder="Phase name" value={m.phase} onChange={e => setMile(i, 'phase', e.target.value)} />
                  <input className="fld-input fld-mono" placeholder="e.g. Week 1–2" value={m.duration} onChange={e => setMile(i, 'duration', e.target.value)} />
                  <button className="li-del" onClick={() => delMile(i)} disabled={timeline.length === 1} aria-label="Remove phase"><i className="ph ph-trash"></i></button>
                </div>
              ))}
            </div>
          </SectionCard>

          {/* Terms */}
          <SectionCard sk="terms" title="Terms & conditions">
            <textarea className="fld-textarea" value={termsText} onChange={e => setTermsText(e.target.value)} placeholder="Payment terms, validity, scope-change policy…"></textarea>
            <div className="snips">
              <span className="snips-label">Quick fill:</span>
              {TERMS_SNIPPETS.map(s => <button key={s.label} className="snip" onClick={() => setTermsText(s.text)}>{s.label}</button>)}
            </div>
          </SectionCard>

          {/* Acceptance */}
          <SectionCard sk="acceptance" title="Acceptance">
            <p className="fld-hint" style={{ margin: 0 }}>A signature block for the client and date is added to the proposal. No fields to fill — it prints as signing lines.</p>
          </SectionCard>

        </div>

        {/* ── LIVE PREVIEW ── */}
        <aside className="pe-preview">
          <div className="pe-prev-bar">
            <span className="pe-prev-lbl"><i className="ph ph-eye"></i> Live preview</span>
            <button className="pe-expand" onClick={() => setPreviewOpen(true)}><i className="ph ph-arrows-out"></i> Fullscreen</button>
          </div>
          <ScaledPaper>
            <window.ProposalDoc data={docData} />
          </ScaledPaper>
        </aside>
      </div>

      {previewOpen && (
        <div className="pv-overlay" onClick={() => setPreviewOpen(false)}>
          <div className="pv-modal" onClick={e => e.stopPropagation()}>
            <div className="pv-modal-bar">
              <span className="ttl">Preview</span>
              <div style={{ display: 'flex', gap: 'var(--space-2)' }}>
                <button className="pv-close" onClick={() => window.print()} aria-label="Export PDF" title="Export PDF"><i className="ph ph-file-pdf"></i></button>
                <button className="pv-close" onClick={() => setPreviewOpen(false)} aria-label="Close"><i className="ph ph-x"></i></button>
              </div>
            </div>
            <window.ProposalDoc data={docData} />
          </div>
        </div>
      )}
    </window.AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Editor />);
</script>
</body>
</html>
