<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SC Design — Proposal Builder</title>
<style>
  :root{
    --blue:#0057FF;
    --navy:#0B1B3B;
    --ink:#0B1B3B;
    --paper:#FFFFFF;
    --app:#EEF1F7;
    --panel:#FFFFFF;
    --line:#E5E8F0;
    --line-2:#EDF0F6;
    --muted:#69748C;
    --muted-2:#9aa3b6;
    --field:#F6F7FB;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--app);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }

  /* ============ APP SHELL ============ */
  .app{display:grid;grid-template-columns:430px 1fr;min-height:100vh;}

  /* ---- toolbar ---- */
  .topbar{
    grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;
    padding:13px 22px;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .topbar .brand{display:flex;align-items:center;gap:14px;}
  .topbar .brand img{height:24px;width:auto;display:block;}
  .topbar .brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;}
  .topbar .actions{display:flex;gap:9px;align-items:center;}
  .tbtn{
    font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 15px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;
    transition:border-color .15s,background .15s,color .15s;
  }
  .tbtn:hover{border-color:var(--blue);color:var(--blue);}
  .tbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .tbtn.primary:hover{background:#0049d6;color:#fff;}
  .tbtn.ghost{border-color:transparent;color:var(--muted);}
  .tbtn.ghost:hover{color:var(--navy);background:var(--field);}
  .tbtn svg{display:block;}

  /* ============ EDITOR PANEL ============ */
  .editor{
    background:var(--panel);border-right:1px solid var(--line);
    height:calc(100vh - 51px);overflow-y:auto;position:sticky;top:51px;
  }
  .editor-inner{padding:8px 22px 80px;}

  details.grp{border-bottom:1px solid var(--line-2);}
  details.grp > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:18px 2px;font-size:14px;font-weight:700;color:var(--navy);user-select:none;
  }
  details.grp > summary::-webkit-details-marker{display:none;}
  summary .chev{transition:transform .2s;color:var(--muted-2);margin-left:auto;}
  details[open] > summary .chev{transform:rotate(90deg);}
  summary .num{font-family:var(--mono);font-size:11px;color:var(--blue);font-weight:600;
    letter-spacing:.05em;width:20px;}
  .grp-body{padding:2px 2px 24px;display:flex;flex-direction:column;gap:14px;}

  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);
    letter-spacing:.02em;margin-bottom:6px;text-transform:uppercase;}
  .field label .opt{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted-2);}
  .field input,.field textarea,.field select{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    background:var(--field);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;transition:border-color .15s,background .15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--blue);background:#fff;
  }
  .field textarea{resize:vertical;min-height:84px;line-height:1.55;}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted-2);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  /* dynamic list rows */
  .rows{display:flex;flex-direction:column;gap:10px;}
  .scope-block{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;}
  .scope-block .sb-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .scope-block .sb-head input{font-weight:600;}
  .item-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .item-row input{flex:1;}
  .li-row{display:grid;grid-template-columns:1fr 56px 86px 30px;gap:8px;align-items:center;}
  .li-row .li-desc{grid-column:1 / -1;}
  .li-row.head{grid-template-columns:1fr 56px 86px 30px;}
  .li-row .lab{font-size:10px;font-weight:600;color:var(--muted-2);text-transform:uppercase;letter-spacing:.03em;}
  .pay-row{display:grid;grid-template-columns:1fr 70px 30px;gap:8px;align-items:center;}
  .term-row{display:flex;gap:8px;align-items:flex-start;}
  .term-row textarea{min-height:54px;}

  .icon-btn{
    flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--muted);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.15s;padding:0;
  }
  .icon-btn:hover{border-color:#e0584f;color:#e0584f;}
  .add-btn{
    align-self:flex-start;font-size:13px;font-weight:600;color:var(--blue);background:none;
    border:1px dashed var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .add-btn:hover{border-color:var(--blue);background:rgba(0,87,255,.04);}

  .inline-grp{display:flex;gap:12px;}
  .inline-grp .field{flex:1;}

  /* ============ PREVIEW / PAPER ============ */
  .preview{padding:40px;display:flex;justify-content:center;align-items:flex-start;}
  .paper{
    width:816px;min-height:1056px;background:var(--paper);
    box-shadow:0 1px 3px rgba(11,27,59,.08),0 12px 40px rgba(11,27,59,.10);
    position:relative;overflow:hidden;
  }
  .doc{padding:72px 72px 0;}

  /* cover */
  .cover-top{display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:30px;border-bottom:1px solid var(--line);}
  .cover-top img.logo{height:30px;width:auto;display:block;}
  .cover-top .ploc{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);text-align:right;}
  .cover-top .ploc .star{color:#f5b301;}

  .cover-hd{padding:46px 0 36px;}
  .cover-hd .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--blue);margin:0 0 18px;}
  .cover-hd h1{font-size:42px;line-height:1.06;letter-spacing:-.025em;font-weight:800;
    margin:0;max-width:18ch;color:var(--navy);}

  .meta{display:grid;grid-template-columns:1fr 1fr;gap:30px 40px;
    padding:28px 0 36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .meta .blk .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
  .meta .blk .v{font-size:14.5px;color:var(--ink);}
  .meta .blk .v .name{font-weight:700;font-size:15.5px;}
  .meta .blk .v .ln{display:block;color:var(--muted);font-size:13px;margin-top:2px;}
  .meta .blk.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;}
  .meta .blk.facts .f .k{margin-bottom:5px;}
  .meta .blk.facts .f .fv{font-family:var(--mono);font-size:13.5px;color:var(--ink);}

  /* generic section */
  section.s{padding:40px 0;border-bottom:1px solid var(--line);}
  section.s:last-of-type{border-bottom:none;}
  .s-head{display:flex;align-items:baseline;gap:13px;margin-bottom:22px;}
  .s-head .sn{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:600;letter-spacing:.06em;}
  .s-head h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:0;color:var(--navy);}
  .overview p{font-size:15px;line-height:1.7;color:#34405a;margin:0;max-width:64ch;white-space:pre-wrap;}

  /* scope */
  .scope-grid{display:flex;flex-direction:column;gap:26px;}
  .scope-item .si-title{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 12px;
    display:flex;align-items:center;gap:10px;}
  .scope-item .si-title .dot{width:9px;height:9px;border-radius:2.5px;background:var(--blue);flex:0 0 auto;}
  .scope-item ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px 32px;}
  .scope-item li{font-size:14px;color:#34405a;line-height:1.5;padding-left:20px;position:relative;}
  .scope-item li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;
    border:1.5px solid var(--blue);border-radius:50%;}

  /* pricing */
  table.price{width:100%;border-collapse:collapse;}
  table.price thead th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;
    padding:0 0 12px;border-bottom:1.5px solid var(--navy);}
  table.price thead th.r{text-align:right;}
  table.price tbody td{padding:14px 0;border-bottom:1px solid var(--line-2);
    font-size:14px;color:var(--ink);vertical-align:top;}
  table.price tbody td.desc .d-main{font-weight:600;}
  table.price tbody td.desc .d-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  table.price tbody td.num{font-family:var(--mono);font-size:13px;text-align:right;color:#34405a;white-space:nowrap;}
  table.price tbody td.amt{font-family:var(--mono);font-size:13.5px;text-align:right;font-weight:600;white-space:nowrap;}

  .totals{margin-top:18px;display:flex;justify-content:flex-end;}
  .totals .box{width:300px;}
  .totals .tr{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;color:#34405a;}
  .totals .tr .lab{color:var(--muted);}
  .totals .tr .val{font-family:var(--mono);font-size:13.5px;}
  .totals .tr.grand{margin-top:6px;padding:16px 18px;background:var(--navy);border-radius:11px;color:#fff;align-items:center;}
  .totals .tr.grand .lab{color:#aebcf2;font-weight:600;font-size:13px;letter-spacing:.02em;}
  .totals .tr.grand .val{color:#fff;font-size:20px;font-weight:700;}
  .totals .tr.grand .val .cur{font-size:12px;color:#aebcf2;margin-right:5px;font-family:var(--mono);}

  /* payment */
  .pay-grid{display:flex;flex-direction:column;gap:0;}
  .pay-line{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2);}
  .pay-line:last-child{border-bottom:none;}
  .pay-line .pl-n{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:600;width:26px;flex:0 0 auto;}
  .pay-line .pl-label{flex:1;font-size:14px;color:var(--ink);}
  .pay-line .pl-pct{font-family:var(--mono);font-size:12.5px;color:var(--muted);width:54px;text-align:right;flex:0 0 auto;}
  .pay-line .pl-amt{font-family:var(--mono);font-size:14px;font-weight:600;width:110px;text-align:right;flex:0 0 auto;}
  .pay-note{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6;}

  /* terms */
  .terms-list{margin:0;padding:0;list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:14px;}
  .terms-list li{display:flex;gap:14px;font-size:13.5px;line-height:1.6;color:#34405a;counter-increment:t;}
  .terms-list li::before{content:counter(t,decimal-leading-zero);font-family:var(--mono);
    font-size:11px;color:var(--blue);font-weight:600;flex:0 0 auto;width:24px;padding-top:2px;}

  /* footer band */
  .doc-foot{margin-top:30px;position:relative;}
  .doc-foot .bar{display:flex;justify-content:space-between;align-items:flex-end;
    padding:22px 72px 18px;}
  .doc-foot .bar .fl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);}
  .doc-foot .bar .fl b{color:var(--navy);font-weight:700;}
  .doc-foot .skyline{line-height:0;}
  .doc-foot .skyline svg,.doc-foot .skyline img{width:100%;display:block;opacity:.07;}

  /* empty-state hint inside fields */
  .placeholder-soft{color:var(--muted-2);}

  /* ============ PRINT ============ */
  @media print{
    @page{size:Letter;margin:0;}
    body{background:#fff;}
    .topbar,.editor{display:none !important;}
    .app{display:block;}
    .preview{padding:0;display:block;}
    .paper{width:100%;min-height:auto;box-shadow:none;}
    .doc{padding:54px 56px 0;}
    .doc-foot .bar{padding:22px 56px 16px;}
    section.s{break-inside:avoid;}
    .scope-item,.pay-line,table.price tr,.terms-list li{break-inside:avoid;}
  }

  /* hide-editor mode */
  body.solo .app{grid-template-columns:1fr;}
  body.solo .editor{display:none;}
  body.solo .preview{padding:40px 20px;}

  @media(max-width:1180px){
    .app{grid-template-columns:380px 1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ TOPBAR ============ -->
  <div class="topbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="SC Design">
      <span class="tag">Proposal Builder</span>
    </div>
    <div class="actions">
      <button class="tbtn ghost" id="resetBtn" title="Clear all fields">Reset</button>
      <button class="tbtn ghost" id="soloBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="soloLbl">Preview</span>
      </button>
      <button class="tbtn primary" id="printBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Save PDF
      </button>
    </div>
  </div>

  <!-- ============ EDITOR ============ -->
  <aside class="editor">
    <div class="editor-inner" id="editorInner"></div>
  </aside>

  <!-- ============ PREVIEW ============ -->
  <main class="preview">
    <div class="paper" id="paper">
      <div class="doc">
        <!-- cover -->
        <div class="cover-top">
          <img class="logo" src="assets/logo.svg" alt="SC Design">
          <div class="ploc"><span class="star">★</span> Chicago, IL</div>
        </div>
        <div class="cover-hd">
          <p class="eyebrow" id="pv-kicker">Project Proposal</p>
          <h1 id="pv-title"></h1>
        </div>
        <div class="meta">
          <div class="blk">
            <div class="k">Prepared for</div>
            <div class="v" id="pv-client"></div>
          </div>
          <div class="blk">
            <div class="k">Prepared by</div>
            <div class="v" id="pv-from"></div>
          </div>
          <div class="blk facts" id="pv-facts"></div>
        </div>

        <!-- sections injected -->
        <section class="s overview" id="sec-overview">
          <div class="s-head"><span class="sn">01</span><h2>Project Overview</h2></div>
          <div class="overview"><p id="pv-overview"></p></div>
        </section>

        <section class="s" id="sec-scope">
          <div class="s-head"><span class="sn">02</span><h2>Scope of Work</h2></div>
          <div class="scope-grid" id="pv-scope"></div>
        </section>

        <section class="s" id="sec-pricing">
          <div class="s-head"><span class="sn">03</span><h2>Investment</h2></div>
          <table class="price">
            <thead><tr>
              <th>Description</th>
              <th class="r">Qty</th>
              <th class="r">Rate</th>
              <th class="r">Amount</th>
            </tr></thead>
            <tbody id="pv-items"></tbody>
          </table>
          <div class="totals"><div class="box" id="pv-totals"></div></div>
        </section>

        <section class="s" id="sec-payment">
          <div class="s-head"><span class="sn">04</span><h2>Payment Schedule</h2></div>
          <div class="pay-grid" id="pv-payment"></div>
          <div class="pay-note" id="pv-paynote"></div>
        </section>

        <section class="s" id="sec-terms">
          <div class="s-head"><span class="sn">05</span><h2>Terms &amp; Conditions</h2></div>
          <ol class="terms-list" id="pv-terms"></ol>
        </section>
      </div>

      <div class="doc-foot">
        <div class="bar">
          <div class="fl"><b id="pv-foot-name">SC Design &amp; Consultation</b></div>
          <div class="fl" id="pv-foot-meta"></div>
        </div>
        <div class="skyline"><img src="assets/skyline-navy.svg" alt=""></div>
      </div>
    </div>
  </main>
</div>

<script>
const STORE_KEY = 'sc-proposal-v1';
const $ = (s,r=document)=>r.querySelector(s);

/* ---------- default data ---------- */
function defaults(){
  return {
    title:'Website Design & Development',
    kicker:'Project Proposal',
    // client
    clientName:'', clientCompany:'', clientEmail:'',
    // from
    fromName:'SC Design & Consultation', fromContact:'', fromEmail:'hello@scdesign.com', fromPhone:'',
    // facts
    proposalNo:'SC-2026-001',
    date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    validDays:'30',
    timeline:'6–8 weeks',
    overview:'',
    scope:[
      {title:'Website Design', items:['Discovery & brand alignment','Sitemap & wireframes','Custom UI design (desktop + mobile)','Up to 6 key page layouts','Two rounds of revisions']},
      {title:'Development & Build', items:['Responsive front-end build','CMS setup & content entry','Contact / lead forms','Performance & SEO basics','Cross-browser QA & launch']},
      {title:'Ongoing Maintenance', items:['Monthly software updates','Security monitoring','Backups & uptime checks','Up to 2 hrs of content edits / mo','Priority email support']}
    ],
    items:[
      {desc:'Website Design', sub:'Discovery, wireframes, and custom UI design', qty:1, rate:4500},
      {desc:'Website Development', sub:'Responsive build, CMS setup, QA & launch', qty:1, rate:5500},
      {desc:'Ongoing Maintenance', sub:'Monthly retainer — updates, backups, support', qty:12, rate:250}
    ],
    taxOn:false, taxRate:0,
    discount:0,
    payment:[
      {label:'Deposit to begin — design phase', pct:40},
      {label:'Development milestone', pct:35},
      {label:'On launch / final delivery', pct:25}
    ],
    payNote:'Maintenance retainer is billed monthly and is not included in the project payment schedule above. Deposit is non-refundable and reserves your spot in the production calendar.',
    terms:[
      'This proposal is valid for the number of days noted above from the date of issue.',
      'Project begins upon receipt of the signed proposal and the initial deposit.',
      'The scope above reflects the agreed deliverables. Work beyond this scope will be quoted separately before it begins.',
      'Two rounds of revisions are included per design deliverable. Additional rounds are billed at the standard hourly rate.',
      'The client is responsible for providing content, brand assets, and timely feedback to keep the timeline on track.',
      'Final files and ownership transfer to the client upon receipt of final payment.'
    ]
  };
}

let state = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s&&s.title!==undefined) return s; }catch(e){}
  return defaults();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ---------- currency ---------- */
const money = n => '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyShort = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ============ EDITOR BUILD ============ */
function field(label, key, opts={}){
  const ph = opts.ph||'';
  const val = state[key]??'';
  if(opts.area){
    return `<div class="field"><label>${label}</label><textarea data-field="${key}" placeholder="${ph}">${esc(val)}</textarea></div>`;
  }
  return `<div class="field"><label>${label}</label><input type="${opts.type||'text'}" data-field="${key}" value="${escA(val)}" placeholder="${ph}"></div>`;
}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function buildEditor(){
  const el = $('#editorInner');
  el.innerHTML = `
    <details class="grp" open>
      <summary><span class="num">01</span>Proposal Details<span class="chev">›</span></summary>
      <div class="grp-body">
        ${field('Project title','title',{ph:'Website Design & Development'})}
        ${field('Kicker / label','kicker',{ph:'Project Proposal'})}
        <div class="three">
          ${field('Proposal #','proposalNo',{ph:'SC-2026-001'})}
          ${field('Date','date')}
          ${field('Valid (days)','validDays',{ph:'30'})}
        </div>
        ${field('Estimated timeline','timeline',{ph:'6–8 weeks'})}
      </div>
    </details>

    <details class="grp" open>
      <summary><span class="num">02</span>Client &amp; Sender<span class="chev">›</span></summary>
      <div class="grp-body">
        <div style="font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.04em;text-transform:uppercase;">Prepared for</div>
        ${field('Client / contact name','clientName',{ph:'Jordan Avery'})}
        ${field('Company','clientCompany',{ph:'Avery & Co.'})}
        ${field('Email','clientEmail',{ph:'jordan@averyco.com'})}
        <div style="font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.04em;text-transform:uppercase;margin-top:6px;">Prepared by</div>
        ${field('Studio / your name','fromName',{ph:'SC Design & Consultation'})}
        ${field('Contact name','fromContact',{ph:'Your name'})}
        <div class="two">
          ${field('Email','fromEmail',{ph:'hello@scdesign.com'})}
          ${field('Phone','fromPhone',{ph:'(312) 555-0148'})}
        </div>
      </div>
    </details>

    <details class="grp" open>
      <summary><span class="num">03</span>Project Overview<span class="chev">›</span></summary>
      <div class="grp-body">
        ${field('Overview narrative','overview',{area:true,ph:'A short paragraph describing the project, the client’s goals, and how SC Design will approach the work.'})}
      </div>
    </details>

    <details class="grp">
      <summary><span class="num">04</span>Scope of Work<span class="chev">›</span></summary>
      <div class="grp-body"><div class="rows" id="ed-scope"></div>
        <button class="add-btn" data-add="scope">+ Add scope group</button>
      </div>
    </details>

    <details class="grp">
      <summary><span class="num">05</span>Pricing<span class="chev">›</span></summary>
      <div class="grp-body">
        <div class="rows" id="ed-items"></div>
        <button class="add-btn" data-add="item">+ Add line item</button>
        <div class="field" style="margin-top:6px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);">
            <input type="checkbox" data-field="taxOn" style="width:auto;" ${state.taxOn?'checked':''}> Apply tax
          </label>
        </div>
        <div class="two">
          ${field('Tax rate %','taxRate',{type:'number'})}
          ${field('Discount $','discount',{type:'number'})}
        </div>
      </div>
    </details>

    <details class="grp">
      <summary><span class="num">06</span>Payment Schedule<span class="chev">›</span></summary>
      <div class="grp-body">
        <div class="rows" id="ed-payment"></div>
        <button class="add-btn" data-add="pay">+ Add payment stage</button>
        ${field('Schedule note','payNote',{area:true})}
      </div>
    </details>

    <details class="grp">
      <summary><span class="num">07</span>Terms &amp; Conditions<span class="chev">›</span></summary>
      <div class="grp-body"><div class="rows" id="ed-terms"></div>
        <button class="add-btn" data-add="term">+ Add term</button>
      </div>
    </details>
  `;
  buildScopeEditor();
  buildItemsEditor();
  buildPaymentEditor();
  buildTermsEditor();
}

function buildScopeEditor(){
  const c = $('#ed-scope'); c.innerHTML='';
  state.scope.forEach((grp,gi)=>{
    const block = document.createElement('div'); block.className='scope-block';
    block.innerHTML = `
      <div class="sb-head">
        <input value="${escA(grp.title)}" data-scope-title="${gi}" placeholder="Group title">
        <button class="icon-btn" data-del-scope="${gi}" title="Remove group">${trashSvg()}</button>
      </div>
      <div class="sb-items"></div>
      <button class="add-btn" data-add-scope-item="${gi}" style="font-size:12px;padding:7px 11px;">+ Item</button>
    `;
    const itc = block.querySelector('.sb-items');
    grp.items.forEach((it,ii)=>{
      const row=document.createElement('div'); row.className='item-row';
      row.innerHTML=`<input value="${escA(it)}" data-scope-item="${gi}.${ii}" placeholder="Deliverable">
        <button class="icon-btn" data-del-scope-item="${gi}.${ii}" title="Remove">${trashSvg()}</button>`;
      itc.appendChild(row);
    });
    c.appendChild(block);
  });
}

function buildItemsEditor(){
  const c=$('#ed-items'); c.innerHTML='';
  state.items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='li-row';
    row.innerHTML=`
      <input class="li-desc" value="${escA(it.desc)}" data-item="${i}.desc" placeholder="Line item name">
      <input class="li-desc" value="${escA(it.sub||'')}" data-item="${i}.sub" placeholder="Short description (optional)">
      <input type="number" value="${it.qty}" data-item="${i}.qty" placeholder="Qty" min="0">
      <input type="number" value="${it.rate}" data-item="${i}.rate" placeholder="Rate" min="0">
      <button class="icon-btn" data-del-item="${i}" title="Remove">${trashSvg()}</button>`;
    c.appendChild(row);
  });
}

function buildPaymentEditor(){
  const c=$('#ed-payment'); c.innerHTML='';
  state.payment.forEach((p,i)=>{
    const row=document.createElement('div'); row.className='pay-row';
    row.innerHTML=`
      <input value="${escA(p.label)}" data-pay="${i}.label" placeholder="Stage description">
      <input type="number" value="${p.pct}" data-pay="${i}.pct" placeholder="%" min="0" max="100">
      <button class="icon-btn" data-del-pay="${i}" title="Remove">${trashSvg()}</button>`;
    c.appendChild(row);
  });
}

function buildTermsEditor(){
  const c=$('#ed-terms'); c.innerHTML='';
  state.terms.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='term-row';
    row.innerHTML=`<textarea data-term="${i}" placeholder="Term or condition">${esc(t)}</textarea>
      <button class="icon-btn" data-del-term="${i}" title="Remove">${trashSvg()}</button>`;
    c.appendChild(row);
  });
}

function trashSvg(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;}

/* ============ RENDER PREVIEW ============ */
function calc(){
  let subtotal = state.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.rate)||0),0);
  const discount = Number(state.discount)||0;
  const afterDisc = Math.max(0, subtotal-discount);
  const tax = state.taxOn ? afterDisc*(Number(state.taxRate)||0)/100 : 0;
  const total = afterDisc+tax;
  return {subtotal,discount,tax,total};
}

function render(){
  const d=state;
  $('#pv-kicker').textContent = d.kicker||'Project Proposal';
  $('#pv-title').textContent = d.title||'Untitled Project';

  // client
  const cName = d.clientName||'Client Name';
  let clientHtml = `<span class="name">${esc(cName)}</span>`;
  if(d.clientCompany) clientHtml += `<span class="ln">${esc(d.clientCompany)}</span>`;
  if(d.clientEmail) clientHtml += `<span class="ln">${esc(d.clientEmail)}</span>`;
  $('#pv-client').innerHTML = clientHtml;

  // from
  let fromHtml = `<span class="name">${esc(d.fromName||'SC Design')}</span>`;
  if(d.fromContact) fromHtml += `<span class="ln">${esc(d.fromContact)}</span>`;
  if(d.fromEmail) fromHtml += `<span class="ln">${esc(d.fromEmail)}</span>`;
  if(d.fromPhone) fromHtml += `<span class="ln">${esc(d.fromPhone)}</span>`;
  $('#pv-from').innerHTML = fromHtml;

  // facts
  const facts=[];
  if(d.proposalNo) facts.push(['Proposal No.',d.proposalNo]);
  if(d.date) facts.push(['Date',d.date]);
  if(d.validDays) facts.push(['Valid for',d.validDays+' days']);
  if(d.timeline) facts.push(['Timeline',d.timeline]);
  $('#pv-facts').innerHTML = facts.map(f=>`<div class="f"><div class="k">${esc(f[0])}</div><div class="fv">${esc(f[1])}</div></div>`).join('');

  // overview
  const ov = d.overview && d.overview.trim();
  $('#pv-overview').innerHTML = ov ? esc(d.overview) :
    `<span class="placeholder-soft">Add a project overview in the editor — describe the client’s goals and how SC Design will deliver.</span>`;

  // scope
  $('#pv-scope').innerHTML = d.scope.map(g=>`
    <div class="scope-item">
      <div class="si-title"><span class="dot"></span>${esc(g.title||'Scope group')}</div>
      <ul>${g.items.filter(i=>i.trim()).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    </div>`).join('');
  $('#sec-scope').style.display = d.scope.length ? '' : 'none';

  // pricing
  $('#pv-items').innerHTML = d.items.map(it=>{
    const amt=(Number(it.qty)||0)*(Number(it.rate)||0);
    return `<tr>
      <td class="desc"><div class="d-main">${esc(it.desc||'Line item')}</div>${it.sub?`<div class="d-sub">${esc(it.sub)}</div>`:''}</td>
      <td class="num">${Number(it.qty)||0}</td>
      <td class="num">${money(it.rate)}</td>
      <td class="amt">${money(amt)}</td>
    </tr>`;
  }).join('');

  const t=calc();
  let totalsHtml = `<div class="tr"><span class="lab">Subtotal</span><span class="val">${money(t.subtotal)}</span></div>`;
  if(t.discount>0) totalsHtml += `<div class="tr"><span class="lab">Discount</span><span class="val">−${money(t.discount)}</span></div>`;
  if(d.taxOn && t.tax>0) totalsHtml += `<div class="tr"><span class="lab">Tax (${Number(d.taxRate)||0}%)</span><span class="val">${money(t.tax)}</span></div>`;
  totalsHtml += `<div class="tr grand"><span class="lab">Total</span><span class="val"><span class="cur">USD</span>${money(t.total)}</span></div>`;
  $('#pv-totals').innerHTML = totalsHtml;

  // payment
  const total=t.total;
  $('#pv-payment').innerHTML = d.payment.map((p,i)=>{
    const amt = total*(Number(p.pct)||0)/100;
    return `<div class="pay-line">
      <span class="pl-n">${String(i+1).padStart(2,'0')}</span>
      <span class="pl-label">${esc(p.label||'Payment stage')}</span>
      <span class="pl-pct">${Number(p.pct)||0}%</span>
      <span class="pl-amt">${money(amt)}</span>
    </div>`;
  }).join('');
  const pctSum = d.payment.reduce((s,p)=>s+(Number(p.pct)||0),0);
  let note = d.payNote||'';
  $('#pv-paynote').innerHTML = (pctSum!==100 && d.payment.length ? `<span style="color:#e0584f;">Heads up: payment stages total ${pctSum}% (should be 100%).</span> ` : '') + esc(note);
  $('#sec-payment').style.display = d.payment.length ? '' : 'none';

  // terms
  $('#pv-terms').innerHTML = d.terms.filter(t=>t.trim()).map(t=>`<li>${esc(t)}</li>`).join('');
  $('#sec-terms').style.display = d.terms.filter(t=>t.trim()).length ? '' : 'none';

  // footer
  $('#pv-foot-name').innerHTML = esc(d.fromName||'SC Design & Consultation');
  const fm=[]; if(d.proposalNo) fm.push(d.proposalNo); if(d.fromEmail) fm.push(d.fromEmail);
  $('#pv-foot-meta').textContent = fm.join('  ·  ');
}

/* ============ EVENTS ============ */
function bindEvents(){
  const ed=$('#editorInner');

  ed.addEventListener('input', e=>{
    const t=e.target;
    if(t.dataset.field!==undefined){
      const k=t.dataset.field;
      state[k] = t.type==='checkbox' ? t.checked : t.value;
    }
    else if(t.dataset.scopeTitle!==undefined){ state.scope[+t.dataset.scopeTitle].title=t.value; }
    else if(t.dataset.scopeItem!==undefined){ const[g,i]=t.dataset.scopeItem.split('.').map(Number); state.scope[g].items[i]=t.value; }
    else if(t.dataset.item!==undefined){ const[i,f]=t.dataset.item.split('.'); state.items[+i][f]= (f==='qty'||f==='rate')? t.value : t.value; }
    else if(t.dataset.pay!==undefined){ const[i,f]=t.dataset.pay.split('.'); state.payment[+i][f]=t.value; }
    else if(t.dataset.term!==undefined){ state.terms[+t.dataset.term]=t.value; }
    else return;
    save(); render();
  });

  ed.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const add=b.dataset.add;
    if(add==='scope'){ state.scope.push({title:'',items:['']}); save(); buildScopeEditor(); render(); return; }
    if(add==='item'){ state.items.push({desc:'',sub:'',qty:1,rate:0}); save(); buildItemsEditor(); render(); return; }
    if(add==='pay'){ state.payment.push({label:'',pct:0}); save(); buildPaymentEditor(); render(); return; }
    if(add==='term'){ state.terms.push(''); save(); buildTermsEditor(); render(); return; }

    if(b.dataset.addScopeItem!==undefined){ state.scope[+b.dataset.addScopeItem].items.push(''); save(); buildScopeEditor(); render(); return; }
    if(b.dataset.delScope!==undefined){ state.scope.splice(+b.dataset.delScope,1); save(); buildScopeEditor(); render(); return; }
    if(b.dataset.delScopeItem!==undefined){ const[g,i]=b.dataset.delScopeItem.split('.').map(Number); state.scope[g].items.splice(i,1); save(); buildScopeEditor(); render(); return; }
    if(b.dataset.delItem!==undefined){ state.items.splice(+b.dataset.delItem,1); save(); buildItemsEditor(); render(); return; }
    if(b.dataset.delPay!==undefined){ state.payment.splice(+b.dataset.delPay,1); save(); buildPaymentEditor(); render(); return; }
    if(b.dataset.delTerm!==undefined){ state.terms.splice(+b.dataset.delTerm,1); save(); buildTermsEditor(); render(); return; }
  });

  $('#printBtn').addEventListener('click', ()=>window.print());
  $('#soloBtn').addEventListener('click', ()=>{
    document.body.classList.toggle('solo');
    $('#soloLbl').textContent = document.body.classList.contains('solo') ? 'Edit' : 'Preview';
  });
  $('#resetBtn').addEventListener('click', ()=>{
    if(confirm('Clear all fields and start from the default template?')){
      state=defaults(); save(); buildEditor(); render();
    }
  });
}

buildEditor();
bindEvents();
render();
</script>
</body>
</html>
